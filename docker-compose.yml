services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: miniglean
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/miniglean
      - ENVIRONMENT=development
      - ALLOWED_ORIGINS=http://localhost:3000
      - MAX_DOCUMENTS=20
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - EMBEDDING_MODEL=text-embedding-3-small
      - LLM_MODEL=gpt-4o
      - LLM_TEMPERATURE=0.0
      - TOP_K_RESULTS=5
      - LOG_LEVEL=DEBUG
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
